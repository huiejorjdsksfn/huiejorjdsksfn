<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Streaks and weekly activity rhythm">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a33"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f59e0b"/>
  </linearGradient>
</defs>
<style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:scaleY(0)}}
.flt{transform-box:fill-box;transform-origin:center;animation:flt var(--d,6s) ease-in-out var(--t,0s) infinite}
@keyframes flt{0%,100%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(6px,-12px) rotate(2.5deg)}66%{transform:translate(-5px,-5px) rotate(-2deg)}}
.drift{transform-box:fill-box;transform-origin:center;animation:drift var(--d,14s) ease-in-out var(--t,0s) infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26px,14px) scale(1.06)}}
.tw{animation:tw var(--d,4s) ease-in-out var(--t,0s) infinite}
@keyframes tw{0%,100%{opacity:var(--b)}50%{opacity:calc(var(--b) + .45)}}
.shim{animation:shim 5s ease-in-out var(--t,0s) infinite}
@keyframes shim{0%,100%{opacity:1}50%{opacity:.45}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 5s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.9)}}
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{from{transform:translateX(-260px)}to{transform:translateX(1060px)}}
.ring{animation:ring 1.7s cubic-bezier(.2,.7,.2,1) both}
@keyframes ring{from{stroke-dashoffset:var(--len)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wave{animation:wave var(--d,12s) linear infinite}
@keyframes wave{to{transform:translateX(-1000px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1000" height="240" rx="16" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="999" height="239" rx="15.5" fill="none" stroke="#27324d"/>
<text x="32" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Consistency</text>
<text x="968" y="46" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8">last 12 months</text>
<text x="592" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Weekly rhythm</text>
<g class="up" style="animation-delay:0.10s"><rect x="32" y="76" width="236" height="64" rx="12" fill="#0f1830" stroke="#27324d"/>
<text x="50" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><tspan font-size="26" font-weight="700" fill="#f8fafc">3</tspan><tspan dx="8" font-size="13" fill="#94a3b8">days</tspan></text>
<text x="50" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">current streak</text></g>
<g class="up" style="animation-delay:0.22s"><rect x="284" y="76" width="236" height="64" rx="12" fill="#0f1830" stroke="#27324d"/>
<text x="302" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><tspan font-size="26" font-weight="700" fill="#f8fafc">13</tspan><tspan dx="8" font-size="13" fill="#94a3b8">days</tspan></text>
<text x="302" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">longest streak</text></g>
<g class="up" style="animation-delay:0.34s"><rect x="32" y="152" width="236" height="64" rx="12" fill="#0f1830" stroke="#27324d"/>
<text x="50" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><tspan font-size="26" font-weight="700" fill="#f8fafc">Wed</tspan><tspan dx="8" font-size="13" fill="#94a3b8">234 contributions</tspan></text>
<text x="50" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">most active weekday</text></g>
<g class="up" style="animation-delay:0.46s"><rect x="284" y="152" width="236" height="64" rx="12" fill="#0f1830" stroke="#27324d"/>
<text x="302" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><tspan font-size="26" font-weight="700" fill="#f8fafc">May</tspan><tspan dx="8" font-size="13" fill="#94a3b8">390 in 2026</tspan></text>
<text x="302" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">best month</text></g>
<rect x="592" y="92" width="34" height="104" rx="8" fill="#0f1830"/>
<rect class="rise" style="animation-delay:0.20s" x="592" y="141.33333333333334" width="34" height="54.666666666666664" rx="8" fill="#14b8a6"><title>Sun: 123</title></rect>
