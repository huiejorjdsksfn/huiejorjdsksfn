<rect class="rise" style="animation-delay:0.70s" x="842" y="132" width="34" height="64" rx="8" fill="#14b8a6"><title>Fri: 144</title></rect>
<text x="859" y="218" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">Fri</text>
<rect x="892" y="92" width="34" height="104" rx="8" fill="#0f1830"/>
<rect class="rise" style="animation-delay:0.80s" x="892" y="111.55555555555556" width="34" height="84.44444444444444" rx="8" fill="#14b8a6"><title>Sat: 190</title></rect>
<text x="909" y="218" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">Sat</text>
</svg>
