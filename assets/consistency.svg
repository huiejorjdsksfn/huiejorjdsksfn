<rect class="rise" style="animation-delay:0.60s" x="792" y="100.44444444444444" width="34" height="95.55555555555556" rx="8" fill="#14b8a6"><title>Thu: 215</title></rect>
<text x="809" y="218" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">Thu</text>
