<svg xmlns="http://www.w3.org/2000/svg" width="480" height="276" viewBox="0 0 480 276" role="img" aria-label="Kanyange Connect: Church management ERP · ACK St. James Kanyange Parish">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a33"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f59e0b"/>
  </linearGradient>
</defs>
<style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:scaleY(0)}}
.flt{transform-box:fill-box;transform-origin:center;animation:flt var(--d,6s) ease-in-out var(--t,0s) infinite}
@keyframes flt{0%,100%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(6px,-12px) rotate(2.5deg)}66%{transform:translate(-5px,-5px) rotate(-2deg)}}
.drift{transform-box:fill-box;transform-origin:center;animation:drift var(--d,14s) ease-in-out var(--t,0s) infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26px,14px) scale(1.06)}}
.tw{animation:tw var(--d,4s) ease-in-out var(--t,0s) infinite}
@keyframes tw{0%,100%{opacity:var(--b)}50%{opacity:calc(var(--b) + .45)}}
.shim{animation:shim 5s ease-in-out var(--t,0s) infinite}
@keyframes shim{0%,100%{opacity:1}50%{opacity:.45}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 5s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.9)}}
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{from{transform:translateX(-260px)}to{transform:translateX(1060px)}}
.ring{animation:ring 1.7s cubic-bezier(.2,.7,.2,1) both}
@keyframes ring{from{stroke-dashoffset:var(--len)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wave{animation:wave var(--d,12s) linear infinite}
@keyframes wave{to{transform:translateX(-1000px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="480" height="276" rx="16" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="479" height="275" rx="15.5" fill="none" stroke="#27324d"/>
<rect x="0" y="22" width="5" height="232" rx="2.5" fill="url(#accent)"/>
<text x="28" y="44" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Kanyange Connect</text>
<text x="28" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8">Church management ERP · ACK St. James Kanyange Parish</text>
<rect x="386" y="26" width="78" height="22" rx="11" fill="#1e293b"/>
<text x="425" y="41" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Private</text>
<g class="up" style="animation-delay:0.10s"><rect x="28" y="92" width="206" height="54" rx="10" fill="#0f1830" stroke="#27324d"/>
<text x="44" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">1,181</text>
<text x="44" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94a3b8">commits</text></g>
<g class="up" style="animation-delay:0.22s"><rect x="246" y="92" width="206" height="54" rx="10" fill="#0f1830" stroke="#27324d"/>
<text x="262" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">~220k</text>
<text x="262" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94a3b8">lines of TypeScript</text></g>
<g class="up" style="animation-delay:0.34s"><rect x="28" y="156" width="206" height="54" rx="10" fill="#0f1830" stroke="#27324d"/>
<text x="44" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">175</text>
<text x="44" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94a3b8">routes and pages</text></g>
<g class="up" style="animation-delay:0.46s"><rect x="246" y="156" width="206" height="54" rx="10" fill="#0f1830" stroke="#27324d"/>
<text x="262" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">17</text>
<text x="262" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94a3b8">staff roles</text></g>
<g class="flt" style="--d:4s;--t:0s"><rect x="28" y="236" width="58" height="24" rx="12" fill="#0f1830" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="57" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5eead4">React</text></g>
<g class="flt" style="--d:5s;--t:-0.7s"><rect x="94" y="236" width="79.6" height="24" rx="12" fill="#0f1830" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="133.8" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5eead4">TanStack</text></g>
<g class="flt" style="--d:6s;--t:-1.4s"><rect x="181.6" y="236" width="79.6" height="24" rx="12" fill="#0f1830" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="221.39999999999998" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5eead4">Supabase</text></g>
<g class="flt" style="--d:4s;--t:-2.0999999999999996s"><rect x="269.2" y="236" width="94" height="24" rx="12" fill="#0f1830" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="316.2" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5eead4">PostgreSQL</text></g>
<g class="flt" style="--d:5s;--t:-2.8s"><rect x="371.2" y="236" width="79.6" height="24" rx="12" fill="#0f1830" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="411" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5eead4">.NET WPF</text></g>
</svg>
