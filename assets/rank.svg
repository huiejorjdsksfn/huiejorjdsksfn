<text x="362" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">pull requests</text></g>
<g class="up" style="animation-delay:0.5s"><text x="232" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">0</text>
<text x="232" y="169" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94a3b8">issues</text></g>
