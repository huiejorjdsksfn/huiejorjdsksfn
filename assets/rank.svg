<text x="968" y="68" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#f59e0b">51.2 / 100 today</text>
<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs>
<polygon points="520,174 520.0,140.7 609.6,140.7 699.2,140.7 788.8,127.3 878.4,127.3 968.0,107.3 968,174" fill="url(#fill)"/>
<polyline points="520.0,140.7 609.6,140.7 699.2,140.7 788.8,127.3 878.4,127.3 968.0,107.3" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
