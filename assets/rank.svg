<text x="32" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b">Weighted score of commits, pull requests, issues and reviews against fixed reference medians. Stars and followers are left out on purpose:</text>
<text x="32" y="247" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748b">most of this work is private institutional software. Higher score is better; the trend line is the saved rank for each day.</text>
