<circle cx="112" cy="136" r="58" fill="none" stroke="#0f1830" stroke-width="12"/>
<circle class="ring" style="--len:364.4" cx="112" cy="136" r="58" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="177.8" transform="rotate(-90 112 136)"/>
<text x="112" y="148" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">B+</text>
