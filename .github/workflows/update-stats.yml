name: Update profile stats

# Redraws the cards in assets/ from live GitHub data. Needs a repository secret named STATS_TOKEN:
# a personal access token with "repo" and "read:user" scope, so private work is counted (only totals
# are drawn). Without the secret this workflow does nothing, so it can never overwrite the cards with
# public-only numbers.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the token
        id: token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STATS_TOKEN is not set, so the stats were not refreshed."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Draw the cards
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-stats.mjs

      - name: Commit changes
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update profile stats"
            git push
          fi
